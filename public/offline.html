<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline — Let's Get Lunch</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', Segoe UI, Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    color: #111827;
    text-align: center;
    padding: 24px;
  }
  .card { max-width: 360px; }
  img { width: 96px; height: 96px; border-radius: 50%; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 15px; color: #4b5563; line-height: 1.4; margin: 0 0 20px; }
  button {
    background: #4A9FD5;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:active { background: #3a8fc5; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Let's Get Lunch can't reach the network right now. Reconnect and try again — any pages you've already visited are still available from where you left off.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
